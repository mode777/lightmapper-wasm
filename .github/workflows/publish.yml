name: Build & Publish to npm

on:
  release:
    types: [published]
  push:
    branches: [Main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: latest

      - name: Verify toolchain
        run: |
          emcc --version
          cmake --version
          node --version

      - name: Install npm dependencies
        run: npm ci

      - name: Configure WASM build
        run: npm run configure:wasm

      - name: Build WASM module
        run: npm run build:wasm

      - name: Assemble dist folder
        run: npm run build:dist

      - name: Verify dist artifacts
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          echo "All expected artifacts present."

      - name: Type-check
        run: npm run typecheck

      - name: Node smoke test
        run: npm test

      - name: Install chrome-headless-shell
        id: chrome
        run: |
          INSTALLED="$(npx --yes @puppeteer/browsers install chrome-headless-shell@stable --path /tmp/chrome | awk '{print $NF}' | tail -n 1)"
          if [ -x "$INSTALLED" ]; then
            CHROME_SHELL="$INSTALLED"
          else
            CHROME_SHELL="$(find "$INSTALLED" -type f -name chrome-headless-shell | head -n 1)"
          fi
          test -n "$CHROME_SHELL"
          test -x "$CHROME_SHELL"
          echo "path=$CHROME_SHELL" >> "$GITHUB_OUTPUT"
          echo "chrome-headless-shell: $CHROME_SHELL"

      - name: Browser golden bake test
        run: npm run test:bake
        env:
          CHROME_SHELL_PATH: ${{ steps.chrome.outputs.path }}

      - name: Publish to npm
        if: github.event_name == 'release'
        run: npm publish --provenance --access public
