schema: spec-driven

context: |
  Repo purpose: `lightmapper-wasm` is the browser-facing WebAssembly product
  around ands/lightmapper. It owns the Emscripten CMake target, the C shim,
  the low-level JavaScript API, the WebGL2 context/registration layer, the
  browser demo, the npm package, the build-dist step and the release workflow.

  The C library is the upstream submodule `thirdparty/lightmapper`
  (`mode777/lightmapper`). Changes to `lightmapper.h` are proposed and
  implemented upstream and are marked `[lightmapper]` in this repository. The
  wrapper consumes them by bumping the submodule and re-running the
  verification suite. The canonical planning documents live here:
  `docs/wasm-improvements.md` (findings and change sequence) and
  `docs/decisions.md` (ADR log).

  Current package behavior: browser-first ESM, main-thread only
  (`-sENVIRONMENT=web`). The default entry `dist/index.js` ships a separate
  `dist/lightmapper.wasm` fetched at initialization (with `wasmBinary` and
  `locateWasm` escape hatches); the `lightmapper-wasm/single` entry embeds the
  wasm as a base64 payload. `createLightmapperModule` probes
  `EXT_color_buffer_float` and RGBA32F readback, registers the caller's WebGL2
  context with Emscripten, and enforces strict context binding. CI builds both
  flavours, typechecks, runs the Node smoke test and headless Chrome golden
  bake on every push to `Main`, and publishes on release.

  The public showcase lives under `site/` (AD-015): a private Vite + TypeScript
  consumer that links this checkout with `lightmapper-wasm: file:..`, is not in
  the npm tarball and adds no runtime dependency. It has seven procedural
  scenarios (`ao-studio`, `cornell-box`, `emissive-alcove`, `tabletop-atlas`,
  `hdri-studio`, `hdri-outdoor`, `sun-sky-outdoor`) and a site-local,
  package-shaped raw-WebGL bake harness plus a three.js display layer. The
  harness supports an optional linear equirectangular environment that is
  drawn as the bake skybox and used as the display background (AD-017), plus
  uniform or cosine hemisphere weighting (AD-020). The outdoor scenes use a
  larger, softer bake-only sun and a six-texel sampling budget; `hdri-studio`
  and `hdri-outdoor` use checked-in CC0 Poly Haven assets, while
  `sun-sky-outdoor` generates a procedural gradient and sun disk at runtime
  with no asset request. The harness and display are planned for
  promotion as `lightmapper-wasm/bake` (AD-018) and `lightmapper-wasm/three`
  (AD-019); until then they stay under `site/src/bake/` and
  `site/src/display/`. Every lit mesh uses one xatlas atlas with a `[0,1)` UV
  clamp (AD-016). The build workflow
  uploads the tested `dist` artifact, the `site` job builds and tests from it
  with `SITE_BASE=/lightmapper-wasm/`, and the `deploy` job publishes to Pages
  only on `Main` pushes or manual dispatch. Checked-in thumbnails carry scene
  source hashes and a `PREVIEW_VERSION`.

  Targets: WebGL2 / OpenGL ES 3.0 in modern browsers. Emscripten is pinned to
  3.1.64 for reproducible builds, and local scripts and CI reject other
  versions. The wasm path requires `EXT_color_buffer_float` because the
  lightmapper renders to and reads back RGBA32F render targets. The reference
  wasm build is single-threaded: no pthreads, shared memory or SIMD.

  Remaining defects and gaps are catalogued in `docs/wasm-improvements.md`;
  the major packaging, build and sampling issues are fixed. Still open:
  handwritten TypeScript declarations (generated declarations/ABI checks are
  proposed), worker support, broader capability-failure coverage, and promoting
  the showcase harness/display to package entries. The site currently consumes
  the separate-asset default entry; do not describe the old SINGLE_FILE-only
  layout as current.

  Constraints: keep the package ESM-only and browser-first; do not add a
  runtime dependency; keep the public low-level C-shaped API and the
  `createLightmapperModule` entry point; do not claim Node rendering support
  without a real WebGL2 implementation.

# Per-artifact rules
rules:
  proposal:
    - State whether the change introduces, alters, or reverses a decision in
      docs/decisions.md, citing the ADR IDs it implements or supersedes.
    - Do not contradict an Accepted ADR. If a change needs to reverse one,
      supersede it in the same change and add the new ADR.
    - Name the owning repository for every work item. Upstream C changes are
      tagged `[lightmapper]`; this repository is the default owner.
    - State explicit out-of-scope items, especially Node rendering, native GL,
      npm publishing mechanics and C-side rendering behavior not touched.
  design:
    - Ground the design in docs/decisions.md and cite ADR IDs instead of
      restating decisions.
    - Add or update an ADR entry in docs/decisions.md for every new or changed
      decision; use a new sequential ID and mark superseded decisions.
    - Update docs/wasm-improvements.md when a roadmap item changes status, and
      update any baseline document the change makes stale.
    - Include a verification strategy that can run without a physical GPU
      (headless Chrome/ANGLE SwiftShader) for anything that affects rendering,
      packaging or loading.
  specs:
    - Describe observable behavior and requirements; keep rationale and
      trade-offs in the design document and ADR log.
    - 'Preserve the existing capability paths: wasm-build-pipeline covers the
      CMake/Emscripten artifact; wasm-loader covers initialization, context
      registration and module loading; npm-package covers the published
      artifact; c-library-port covers the upstream WebGL2 contract.'
  tasks:
    - Include an explicit task to update docs/decisions.md and
      docs/wasm-improvements.md whenever a decision or roadmap status changes.
    - Include verification tasks for shader sampling, build artifact layout,
      loader behavior and package consumption as applicable.
    - Mark upstream C tasks as [lightmapper] and do not claim they were
      completed in this repository; include the submodule bump that consumes
      them.

# Per-operation guidance
operations:
  apply:
    guidance:
      - Verify the build artifact layout after every packaging change; the
        current default entry emits a separate hashed `lightmapper.wasm`, and
        the site build must emit hashed `lightmapper.wasm` and `xatlas.wasm`
        assets. Run `npm run build:check --prefix site` after packaging work.
      - Keep the WebGL2 capability probe and strict context binding intact
        unless the proposal explicitly covers them.
      - Keep the showcase a consumer of the tested `dist` artifact; do not
        rebuild wasm in the site job, do not install `lightmapper-wasm` from
        the registry, and keep site dependencies confined to `site/`.
      - Keep the harness display-agnostic and the display bake-free. Scene
        source changes require recapturing checked-in thumbnails; preview
        viewport/lighting/material/CSS changes require a `PREVIEW_VERSION`
        bump.
  archive:
    guidance:
      - Confirm docs/decisions.md and docs/wasm-improvements.md describe the
        implemented state, not the planned state.
      - Confirm every [lightmapper] dependency is completed or explicitly left
        open, and that the submodule pointer matches the consumed commit.
      - For showcase changes, confirm the checked-in thumbnails match their
        source hashes and `PREVIEW_VERSION`, and that the site build check
        passes with `SITE_BASE=/lightmapper-wasm/`.
